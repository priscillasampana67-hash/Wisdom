<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackathon</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        .container {
            padding: 40px;
            max-width: 700px;
        }

        h1 {
            font-size: 45px;
            margin-bottom: 20px;
        }

        p {
            font-size: 22px;
            line-height: 1.6;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🚀 Hackathon Ready!</h1>

        <p id="message">
            I'm so glad to join this hackathon!
            I'm ready to give my very best, learn, build,
            and work hard to make it to the top! 🏆💻🔥
        </p>

        <button onclick="showMessage()">Let's Go! 🚀</button>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "I'm giving this hackathon my BEST! 💪🔥<br>" +
                "Let's build something amazing and TOP the competition! 🏆🚀";
        }
    </script>

</body>
</html>
